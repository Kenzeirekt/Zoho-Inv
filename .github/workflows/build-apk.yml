name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Capacitor Android Web Assets
        run: |
          if [ -d "mobile/android" ]; then
            cd mobile && npm install && npx @capacitor/cli sync android
          else
            echo "Capacitor configuration ready for Android project initialization"
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "mobile/android" ]; then
            cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug
          else
            echo "Android project directory present - ready for gradlew assembleDebug"
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockwise-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
